name: Release

on:
    push:
        tags:
            - 'v*.*.*.*'

permissions:
    contents: write

jobs:
    cli:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Validate maintenance release tag
              run: |
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  CLI_VERSION="$(node -p "require('./cli/package.json').version")"
                  test "$TAG_VERSION" = "$CLI_VERSION"

            - name: Verify release commit is on main
              run: |
                  git fetch origin main:refs/remotes/origin/main
                  git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
            - name: Verify maintained release notes
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  notes_file=".github/release-notes/${tag}.md"
                  test -s "$notes_file"
                  grep -F 'Compared with the previous maintained release' "$notes_file"
                  grep -F 'Compared with the official release' "$notes_file"
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - run: bun install
            - run: bun run build:single-exe:all
            - name: Package CLI release artifacts
              run: |
                  cd cli/dist-exe
                  mkdir -p ../release-artifacts

                  for dir in bun-*/; do
                      target="${dir%/}"
                      if [[ "$target" == bun-darwin-* ]]; then
                          continue
                      fi

                      name="hapi-${target#bun-}"
                      name="${name/windows/win32}"

                      if [[ "$target" == *"windows"* ]]; then
                          zip -j "../release-artifacts/${name}.zip" "$target"/hapi.exe
                      else
                          tar -czvf "../release-artifacts/${name}.tar.gz" -C "$target" hapi
                      fi
                  done
            - name: Upload CLI release artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: cli-release-artifacts
                  path: cli/release-artifacts/*
                  if-no-files-found: error
            - uses: actions/upload-artifact@v4
              with:
                  name: unsigned-binaries
                  path: cli/dist-exe/bun-*/hapi*
                  if-no-files-found: error

    sign-macos:
        runs-on: macos-14
        needs: cli
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: unsigned-binaries
                  path: cli/dist-exe
            - name: Import local release signing certificate
              env:
                  SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
                  SIGNING_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
              run: |
                  test -n "$SIGNING_P12"
                  test -n "$SIGNING_P12_PASSWORD"

                  KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
                  KEYCHAIN_PATH="$RUNNER_TEMP/hapi-signing.keychain-db"
                  printf '%s' "$SIGNING_P12" | openssl base64 -d -A > "$RUNNER_TEMP/hapi-signing.p12"

                  security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
                  security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
                  security import "$RUNNER_TEMP/hapi-signing.p12" \
                      -k "$KEYCHAIN_PATH" \
                      -P "$SIGNING_P12_PASSWORD" \
                      -T /usr/bin/codesign
                  security set-key-partition-list \
                      -S apple-tool:,apple: \
                      -s \
                      -k "$KEYCHAIN_PASSWORD" \
                      "$KEYCHAIN_PATH"
                  security list-keychains -d user -s "$KEYCHAIN_PATH"
                  security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            - name: Sign and package macOS release artifacts
              run: |
                  mkdir -p cli/release-artifacts

                  for target in bun-darwin-arm64 bun-darwin-x64; do
                      binary="cli/dist-exe/$target/hapi"
                      chmod 0755 "$binary"
                      codesign \
                          --force \
                          --options runtime \
                          --identifier xyz.hapi.cli \
                          --keychain "$RUNNER_TEMP/hapi-signing.keychain-db" \
                          --sign "HAPI Local Release Signing" \
                          "$binary"
                      codesign --verify --strict --verbose=2 "$binary"
                      codesign --display --requirements - "$binary" 2>&1 \
                          | grep -F 'identifier "xyz.hapi.cli"'
                      tar -czvf "cli/release-artifacts/hapi-${target#bun-}.tar.gz" \
                          -C "cli/dist-exe/$target" hapi
                  done
            - uses: actions/upload-artifact@v4
              with:
                  name: signed-macos-release-artifacts
                  path: cli/release-artifacts/*
                  if-no-files-found: error

    desktop-windows:
        needs: cli
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - run: bun install
            - name: Download CLI release artifacts
              uses: actions/download-artifact@v4
              with:
                  name: cli-release-artifacts
                  path: cli-release-artifacts
            - name: Bundle release CLI for Windows desktop
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force desktop/resources/hapi-cli/win | Out-Null
                  Expand-Archive -LiteralPath "cli-release-artifacts/hapi-win32-x64.zip" -DestinationPath "desktop/resources/hapi-cli/win" -Force
                  if (-not (Test-Path -LiteralPath "desktop/resources/hapi-cli/win/hapi.exe")) {
                      throw "Bundled Windows CLI artifact not found."
                  }
            - run: cd desktop && bun run sync:release-version && bun run package:win:prebundled
            - name: Package Windows desktop release artifact
              shell: pwsh
              run: |
                  New-Item -ItemType Directory -Force desktop/release-artifacts | Out-Null
                  if (-not (Test-Path -LiteralPath "desktop/release/win-unpacked/HAPI Desktop.exe")) {
                      throw "Windows desktop executable not found."
                  }
                  $portable = Get-ChildItem -LiteralPath "desktop/release" -Filter "HAPI Desktop *.exe" -File | Select-Object -First 1
                  if (-not $portable) {
                      throw "Windows desktop portable executable not found."
                  }
                  Compress-Archive -LiteralPath "desktop/release/win-unpacked" -DestinationPath "desktop/release-artifacts/hapi-desktop-win32-x64.zip" -Force
                  Copy-Item -LiteralPath $portable.FullName -Destination "desktop/release-artifacts/hapi-desktop-win32-x64-portable.exe" -Force
            - name: Upload Windows desktop release artifact
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-windows-release-artifacts
                  path: desktop/release-artifacts/*
                  if-no-files-found: error

    desktop-macos:
        needs: [cli, sign-macos]
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14
            - run: bun install
            - name: Download signed macOS CLI artifacts
              uses: actions/download-artifact@v4
              with:
                  name: signed-macos-release-artifacts
                  path: signed-macos-release-artifacts
            - name: Bundle release CLI for macOS desktop
              run: |
                  arch="$(uname -m)"
                  case "$arch" in
                      arm64) desktop_arch="arm64" ;;
                      x86_64) desktop_arch="x64" ;;
                      *) desktop_arch="$arch" ;;
                  esac
                  mkdir -p desktop/resources/hapi-cli/mac
                  tar -xzf "signed-macos-release-artifacts/hapi-darwin-${desktop_arch}.tar.gz" -C desktop/resources/hapi-cli/mac
                  chmod +x desktop/resources/hapi-cli/mac/hapi
                  test -x desktop/resources/hapi-cli/mac/hapi
            - run: cd desktop && bun run sync:release-version && bun run package:mac:prebundled
            - name: Package macOS desktop release artifact
              run: |
                  mkdir -p desktop/release-artifacts
                  app_path="$(find desktop/release -type d -name 'HAPI Desktop.app' -print -quit)"
                  if [[ -z "$app_path" ]]; then
                      echo "macOS desktop app not found." >&2
                      exit 1
                  fi
                  arch="$(uname -m)"
                  case "$arch" in
                      arm64) desktop_arch="arm64" ;;
                      x86_64) desktop_arch="x64" ;;
                      *) desktop_arch="$arch" ;;
                  esac
                  ditto -c -k --sequesterRsrc --keepParent \
                      "$app_path" \
                      "desktop/release-artifacts/hapi-desktop-darwin-${desktop_arch}.zip"
            - name: Upload macOS desktop release artifact
              uses: actions/upload-artifact@v4
              with:
                  name: desktop-macos-release-artifacts
                  path: desktop/release-artifacts/*
                  if-no-files-found: error

    release:
        runs-on: ubuntu-latest
        needs: [cli, sign-macos, desktop-windows, desktop-macos]
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@v4
              with:
                  pattern: '*-release-artifacts'
                  path: cli/release-artifacts
                  merge-multiple: true
            - name: Create checksums
              run: |
                  cd cli/release-artifacts
                  sha256sum * > checksums.txt
            - name: Create Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  notes_file=".github/release-notes/${tag}.md"
                  test -s "$notes_file"
                  gh release create "$tag" \
                      --repo "$GITHUB_REPOSITORY" \
                      --title "Release $tag" \
                      --notes-file "$notes_file" \
                      cli/release-artifacts/*
